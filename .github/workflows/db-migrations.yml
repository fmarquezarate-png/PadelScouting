# Aplica en Supabase las migraciones nuevas de db/migrations/ (ver tools/apply-migrations.sh).
# Necesita el secreto SUPABASE_DB_URL: la cadena de conexión «Session pooler» de Supabase.
name: Base de datos · migraciones

on:
  push:
    branches: [main]
    paths: ['db/migrations/**']
  workflow_dispatch:
    inputs:
      plan:
        description: 'Solo mirar qué se aplicaría (no cambia nada)'
        type: boolean
        default: false

concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Cliente de PostgreSQL
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Aplicar migraciones nuevas
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_URL (Settings → Secrets and variables → Actions)."; exit 1
          fi
          tools/apply-migrations.sh ${{ inputs.plan && '--plan' || '' }}
